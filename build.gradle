
import java.text.SimpleDateFormat

plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

// Git version: git-xxxxxxx
def gitHash = 'unknown'
try {
    def proc = 'git rev-parse --short HEAD'.execute()
    proc.waitFor()
    gitHash = proc.text.trim()
} catch (Exception ignored) {}

def gitDirty = ''
try {
    def proc = 'git diff --quiet'.execute()
    proc.waitFor()
    if (proc.exitValue() != 0) gitDirty = '-dirty'
} catch (Exception ignored) {}

version = "${project.mod_version}-git-${gitHash}${gitDirty}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")))
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    it.options.compilerArgs += ['-nowarn', '-Xlint:none', '-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

tasks.named('jar') {
    from('src/main/resources') {
        include '**/*.json'
        include '**/*.png'
    }
    manifest {
        attributes(
            'Implementation-Title': 'DuskByteClient',
            'Implementation-Version': project.version,
        )
    }
}

// Print version on build
task printVersion {
    doFirst {
        println "Building DuskByteClient v${project.version}"
    }
}
build.dependsOn printVersion
