name: Build and Obfuscate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew
          ./gradlew build

      - name: Find built JAR
        id: findjar
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*sources*" ! -name "*obf*" | head -1)
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT
          echo "Found: $JAR"

      - name: Get all dependency JARs
        id: deps
        run: |
          echo "=== Searching for ALL dependency JARs ==="
          # Find ALL jars in .gradle and ~/.gradle/caches
          DEPS=""
          for f in $(find .gradle -name "*.jar" 2>/dev/null); do DEPS="$DEPS$f;"; done
          for f in $(find ~/.gradle/caches -name "*.jar" 2>/dev/null); do DEPS="$DEPS$f;"; done
          echo "deps=$DEPS" >> $GITHUB_OUTPUT
          COUNT=$(echo "$DEPS" | tr ';' '\n' | grep -c "\.jar")
          echo "Found $COUNT dependency JARs"

      - name: Prepare JAR for ZKM
        run: cp "${{ steps.findjar.outputs.jar_path }}" build/libs/duskbyte_obf.jar

      - name: Run ZKM obfuscation
        run: |
          echo "-injars build/libs/duskbyte_obf.jar" > zkm_obf.pro
          echo "-outjars build/libs/duskbyte_obf.jar" >> zkm_obf.pro
          echo "-libraryjars <java.home>/lib/jrt-fs.jar" >> zkm_obf.pro

          echo "Adding dependency JARs..."
          IFS=';' read -ra DEP_JARS <<< "${{ steps.deps.outputs.deps }}"
          ADDED=0
          for jar in "${DEP_JARS[@]}"; do
            jar=$(echo "$jar" | xargs)
            if [ -f "$jar" ] && [ ${#jar} -lt 300 ]; then
              echo "-libraryjars $jar" >> zkm_obf.pro
              ADDED=$((ADDED+1))
            fi
          done
          echo "Added $ADDED library JARs"

          cat >> zkm_obf.pro << 'ZKEOF'
          -dontshrink
          -dontoptimize
          -keep public class dev.duskbyte.Main { *; }
          -keep class dev.duskbyte.mixin.** { *; }
          -keep class dev.duskbyte.imixin.** { *; }
          -keep class dev.duskbyte.DuskByte { public *; protected *; public static *; }
          -keep class dev.duskbyte.event.** { *; }
          -keep class dev.duskbyte.module.modules.** { public <init>(); }
          -keep class dev.duskbyte.gui.** { public <init>(...); }
          -keep class dev.duskbyte.managers.cloud.** { *; }
          -keep class dev.duskbyte.managers.AuthManager { *; }
          -keep class dev.duskbyte.managers.TranslationManager { *; }
          -keep class net.fabricmc.** { *; }
          -keep class com.google.gson.** { *; }
          -optimizationpasses 3
          -repackageclasses
          -allowaccessmodification
          -renamesourcefileattribute SourceFile
          -printmapping build/libs/mapping.txt
          ZKEOF

          echo "=== zkm_obf.pro ==="
          head -5 zkm_obf.pro
          echo "... ($(wc -l < zkm_obf.pro) lines total)"
          echo "==================="

          java -Xmx2G -jar zkm/zkm27.jar zkm_obf.pro

      - name: Replace original JAR
        run: |
          cp build/libs/duskbyte_obf.jar "${{ steps.findjar.outputs.jar_path }}"
          rm -f build/libs/duskbyte_obf.jar

      - name: Upload obfuscated JAR
        uses: actions/upload-artifact@v4
        with:
          name: DuskByte-Obfuscated-${{ github.sha }}
          path: ${{ steps.findjar.outputs.jar_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: DuskByte-Mapping-${{ github.sha }}
          path: build/libs/mapping.txt
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download obfuscated JAR
        uses: actions/download-artifact@v4
        with:
          name: DuskByte-Obfuscated-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.jar'
          generate_release_notes: true
          draft: false
          prerelease: false
